<!doctype html>
<!-- GAZBOT V7 — the GOLD shadow desk. Its own page, because it is its own desk:
     separate service, separate store, $10.00/pt instead of MNQ's $2.00.
     ★ The page's first job is to make "armed but recording nothing" impossible to miss —
       three of the four blockers in MGC_SHADOW_SCOPE.md fail SILENTLY, and an armed arm that
       never fires looks exactly like a quiet tape. Hence the status strip above the table. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGC Shadow — GAZBOT V7</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a313c; --ink:#e6edf3; --dim:#8b949e;
    --good:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff; --ctrl:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 2px} h1 small{color:var(--dim);font-weight:400;font-size:13px}
  a{color:var(--accent)}
  .nav{margin:0 0 18px;font-size:13px}
  .nav a{margin-right:14px}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .card .v{font-size:20px;font-weight:600;margin-top:3px}
  .ok{color:var(--good)} .no{color:var(--bad)} .wa{color:var(--warn)} .mut{color:var(--dim)}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
        border-radius:6px;padding:11px 14px;margin:0 0 16px;color:var(--dim);font-size:13px}
  .note b{color:var(--ink)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:640px;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#1a2029;color:var(--dim);font-size:11px;text-transform:uppercase;
     letter-spacing:.06em;font-weight:600}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px;
       border:1px solid var(--ctrl);color:var(--ctrl);vertical-align:middle}
  .zero{color:var(--dim)}
  footer{margin-top:22px;color:var(--dim);font-size:12px;line-height:1.7}
  code{background:#1a2029;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MGC Shadow Desk <small>gold · $10.00/pt · observe-only</small></h1>
  <div class="nav">
    <!-- RELATIVE hrefs, matching reports.html: the page is served under the /v7 proxy prefix, so an
         absolute /shadow would 404 in production and only work when hitting :8087 directly. -->
    <a href="./">desk</a><a href="shadow">MNQ shadow</a><a href="router">router</a>
    <a href="reports">reports</a><a href="cube">cube</a>
  </div>

  <div class="strip" id="strip"></div>
  <div class="note" id="caveat"></div>

  <div class="scroll"><table>
    <thead><tr>
      <th>arm</th><th>side</th><th>n</th><th>net</th><th>$/trade</th><th>win</th><th>last trade</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="mut">loading…</td></tr></tbody>
  </table></div>

  <footer id="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const money = v => (v > 0 ? "+$" : v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined,
                    {minimumFractionDigits:2, maximumFractionDigits:2});
const cls = v => v > 0 ? "ok" : v < 0 ? "no" : "zero";

function age(s){
  if (s === null || s === undefined) return "never";
  if (s < 90) return s + "s ago";
  if (s < 5400) return Math.round(s/60) + "m ago";
  if (s < 172800) return (s/3600).toFixed(1) + "h ago";
  return (s/86400).toFixed(1) + "d ago";
}

function render(d){
  // ── the status strip. This is the point of the page: an armed arm that never fires and a dead
  //    feed both show as an empty table, so the two facts that tell them apart go up top.
  const stale = d.depth_age_s === null || d.depth_age_s > 900;
  const feedCls = d.depth_rows === 0 ? "no" : stale ? "wa" : "ok";
  const feedTxt = d.depth_rows === 0 ? "NO ROWS"
                : stale ? "stale " + age(d.depth_age_s) : "live " + age(d.depth_age_s);
  // ⚠ A STORE ERROR MUST NOT RENDER AS "NOTHING YET". They look identical — zeros everywhere — and
  // "nothing yet" is the alarm this page exists to raise, so a broken query imitating it is worse
  // than no page. A data_quality column missing from shadow_mgc.db did exactly that on every
  // request. Errors now take over the status card outright.
  const broke = !!d.error;
  const recCls = broke ? "no" : d.recording ? "ok" : (d.arms.some(a => a.n > 0) ? "wa" : "no");
  const recTxt = broke ? "CANNOT READ STORE"
               : d.recording ? "recording"
               : d.arms.some(a => a.n > 0) ? "idle" : "NOTHING YET";
  const total = d.arms.reduce((s,a) => s + (a.net || 0), 0);
  const n     = d.arms.reduce((s,a) => s + (a.n   || 0), 0);
  $("strip").innerHTML = `
    <div class="card"><div class="k">status</div>
      <div class="v ${recCls}">${recTxt}</div>
      <div class="mut" style="font-size:12px">${broke ? d.error : "last trade " + age(d.last_trade_age_s)
        + (d.pending_reprice ? ` · ${d.pending_reprice} awaiting reprice (not yet in the table below)` : "")}</div></div>
    <div class="card"><div class="k">depth feed (MGC)</div>
      <div class="v ${feedCls}">${feedTxt}</div>
      <div class="mut" style="font-size:12px">${d.depth_rows.toLocaleString()} snapshots</div></div>
    <div class="card"><div class="k">trades</div>
      <div class="v">${n}</div>
      <div class="mut" style="font-size:12px">${d.arms.length} arms armed</div></div>
    <div class="card"><div class="k">net (repriced)</div>
      <div class="v ${cls(total)}">${money(total)}</div>
      <div class="mut" style="font-size:12px">$10.00/pt</div></div>`;

  $("caveat").innerHTML =
    `<b>Read the forward numbers, not the lab's.</b> ${d.caveat}<br>` +
    `<b>Fees:</b> ${d.fee_note}`;

  if (!d.arms.length){
    $("rows").innerHTML = '<tr><td colspan="7" class="no">no arms armed — the slate is empty</td></tr>';
  } else {
    $("rows").innerHTML = d.arms.map(a => {
      const z = a.n === 0;
      return `<tr>
        <td>${a.name}${a.control ? '<span class="tag">control</span>' : ''}</td>
        <td class="mut">${a.side}</td>
        <td class="${z?'zero':''}">${a.n}</td>
        <td class="${z?'zero':cls(a.net)}">${z ? '—' : money(a.net)}</td>
        <td class="${z?'zero':cls(a.exp)}">${z ? '—' : money(a.exp)}</td>
        <td class="${z?'zero':''}">${z ? '—' : a.win.toFixed(1) + '%'}</td>
        <td class="mut">${a.last_ts ? new Date(a.last_ts*1000).toISOString().slice(5,16).replace('T',' ') : '—'}</td>
      </tr>`;
    }).join("");
  }

  $("foot").innerHTML =
    `<b>The control arm is supposed to lose.</b> <code>mgc_break_fade_nobook</code> trades the bare
     break with no book condition. If the two hole arms do not beat it, the book is decorative and
     the thesis is wrong — attributing a filter to itself is how the gold work was fooled before.
     <br><b>Store:</b> <code>${d.store}</code> — separate from <code>shadow.db</code> on purpose:
     the repricer applies ONE multiplier to every pending trade, so a shared store would price gold
     at MNQ's $2.00/pt intermittently.
     ${d.error ? '<br><span class="no"><b>store error:</b> ' + d.error + '</span>' : ''}`;
}

function load(){
  // RELATIVE, like every other page here — it resolves under the /v7 prefix in production.
  fetch("api/mgcshadow", {cache:"no-store"})
    .then(r => r.json()).then(render)
    // ⚠ the strip must be cleared too. Writing only into #rows left the freshness cards frozen on
    // the last good values, so a page that had stopped loading looked alive on a 60s refresh.
    .catch(e => {
      $("strip").innerHTML =
        '<div class="card"><div class="k">status</div><div class="v no">PAGE CANNOT LOAD</div>' +
        '<div class="mut" style="font-size:12px">' + e + '</div></div>';
      $("rows").innerHTML =
        '<tr><td colspan="7" class="no">failed to load: ' + e + '</td></tr>';
    });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
