<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/v7/">
<title>GAZBOT V7 — Reports</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#0e131c; --panel2:#11171f; --line:#1c2530; --line2:#283341;
    --ink:#f4f8fc; --ink2:#d6e2ef; --ink3:#a2b5c8;
    --grn:#3fd97f; --red:#ff5d5d; --amb:#f5b13d; --blu:#5aa9ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 48px}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line2)}
  .hdr{display:flex;align-items:center;gap:12px;padding:12px 14px 10px}
  .hdr h1{font-size:19px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .hdr .badge{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.5px;color:var(--ink3);
    border:1px solid var(--line2);border-radius:20px;padding:5px 10px}
  .tabs{display:flex;border-top:1px solid var(--line)}
  .tab{flex:1;text-align:center;color:var(--ink3);font:600 13px var(--sans);padding:12px 6px;
    border-bottom:2px solid transparent;letter-spacing:.2px}
  .tab.active{color:var(--ink);border-bottom-color:var(--blu)}
  .body{padding:16px 12px}
  .sub{color:var(--ink3);font-size:12.5px;font-family:var(--mono);letter-spacing:.3px;margin:2px 4px 14px}
  /* the concise index — one tight row per report, click to open */
  .rlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .row{display:flex;align-items:center;gap:12px;padding:0;border-bottom:1px solid var(--line);
    transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--panel2)}
  .rmain{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:11px;padding:14px 4px 14px 16px}
  .rdate{flex:0 0 auto;font:600 12px var(--mono);color:var(--blu);letter-spacing:.2px;width:92px}
  .rtitle{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtag{flex:0 0 auto;font:600 9px/1 var(--mono);letter-spacing:.5px;color:var(--ink3);
    border:1px solid var(--line2);border-radius:4px;padding:3px 5px}
  .racts{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding-right:10px}
  .ic{display:inline-flex;align-items:center;justify-content:center;font:600 11px var(--mono);
    color:var(--ink3);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;letter-spacing:.2px}
  .ic:hover{color:var(--ink);border-color:var(--ink3)}
  .ic.play:hover{color:var(--amb);border-color:var(--amb)}
  .arrow{flex:0 0 auto;color:var(--ink3);font:600 15px var(--mono);padding:0 14px 0 2px}
  .row:hover .arrow{color:var(--blu)}
  .empty{color:var(--ink3);text-align:center;padding:48px 12px;font-size:14px}
  .foot{color:var(--ink3);font:11px/1.7 var(--mono);text-align:center;margin-top:20px;padding:0 16px;opacity:.8}
  @media(max-width:520px){ .rmain{flex-wrap:wrap;gap:2px 11px} .rtitle{white-space:normal} .rtag{display:none} }
</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hdr"><h1>GAZBOT V7</h1><span class="badge">REPORTS</span></div>
    <nav class="tabs">
      <a class="tab" href="./">Desk</a>
      <a class="tab" href="shadow">Shadow</a>
      <a class="tab active" href="reports">Reports</a>
    </nav>
  </div>
  <div class="body">
    <div class="sub">Every Friday report — newest first. Click a row to open it.</div>
    <div id="list"><div class="empty">Loading…</div></div>
    <div class="foot">Reports are authored on the desk · nothing here arms anything · prescribe, you decide.</div>
  </div>
</div>
<script>
(function(){
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(iso){ var p=(iso||'').split('-'); if(p.length!==3) return iso;
    return p[2]+' '+(MON[(+p[1])-1]||'')+' '+p[0]; }
  function decode(s){ var t=document.createElement('textarea'); t.innerHTML=s||''; return t.value; }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var el = document.getElementById('list');
  fetch('api/reports').then(function(r){return r.json();}).then(function(d){
    var reps = d.reports || [];
    if(!reps.length){ el.innerHTML = '<div class="empty">No reports yet.</div>'; return; }
    el.innerHTML = '<div class="rlist">' + reps.map(function(x){
      var title = esc(decode(x.title||x.file));
      var tag = /V7/i.test(x.title||'') ? 'V7' : 'V5';
      var acts = '';
      if(x.pdf)  acts += '<a class="ic" href="static/'+x.pdf+'" download title="Download PDF">PDF</a>';
      if(x.play) acts += '<a class="ic play" href="static/'+x.play+'" title="Monday playbook">Playbook</a>';
      return '<div class="row">'
        + '<a class="rmain" href="static/'+x.file+'">'
        +   '<span class="rdate">'+fmtDate(x.date)+'</span>'
        +   '<span class="rtitle">'+title+'</span>'
        +   '<span class="rtag">'+tag+'</span>'
        + '</a>'
        + '<span class="racts">'+acts+'</span>'
        + '<a class="arrow" href="static/'+x.file+'" aria-label="Open">&rarr;</a>'
        + '</div>';
    }).join('') + '</div>';
  }).catch(function(e){ el.innerHTML = '<div class="empty">Could not load reports.<br>'+e+'</div>'; });
})();
</script>
</body></html>
