<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/v7/">
<title>GAZBOT V7 — Reports</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#0e131c; --panel2:#11171f; --line:#1c2530; --line2:#283341;
    --ink:#f4f8fc; --ink2:#d6e2ef; --ink3:#a2b5c8;
    --grn:#3fd97f; --red:#ff5d5d; --amb:#f5b13d; --blu:#5aa9ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 48px}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line2)}
  .hdr{display:flex;align-items:center;gap:12px;padding:12px 14px 10px}
  .hdr h1{font-size:19px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .hdr .badge{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.5px;color:var(--ink3);
    border:1px solid var(--line2);border-radius:20px;padding:5px 10px}
  .tabs{display:flex;border-top:1px solid var(--line)}
  .tab{flex:1;text-align:center;color:var(--ink3);font:600 13px var(--sans);padding:12px 6px;
    border-bottom:2px solid transparent;letter-spacing:.2px}
  .tab.active{color:var(--ink);border-bottom-color:var(--blu)}
  .body{padding:16px 12px}
  .sub{color:var(--ink3);font-size:12.5px;font-family:var(--mono);letter-spacing:.3px;margin:2px 4px 16px}
  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 17px;margin:0 0 12px;transition:border-color .12s,background .12s}
  .rcard:hover{border-color:var(--blu)}
  .rhit{display:block}
  .rk{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .kind{font:600 9.5px/1 var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--amb);
    border:1px solid var(--amb);border-radius:4px;padding:3px 6px}
  .rdate{font:600 11px var(--mono);color:var(--ink3);margin-left:auto;letter-spacing:.3px}
  .rtitle{font-size:16px;font-weight:700;letter-spacing:-.1px;line-height:1.3;text-wrap:balance}
  .ractions{display:flex;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}
  .open,.pdf{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--mono);letter-spacing:.3px;
    padding:7px 13px;border-radius:8px;border:1px solid var(--line2)}
  .open{color:#0a0e14;background:var(--blu);border-color:var(--blu)}
  .open::after{content:"→"}
  .pdf{color:var(--ink2)}
  .pdf::before{content:"⬇ "}
  .pdf:hover{border-color:var(--ink3);color:var(--ink)}
  .empty{color:var(--ink3);text-align:center;padding:48px 12px;font-size:14px}
  .foot{color:var(--ink3);font:11px/1.7 var(--mono);text-align:center;margin-top:24px;padding:0 16px;opacity:.8}
</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="hdr"><h1>GAZBOT V7</h1><span class="badge">REPORTS</span></div>
    <nav class="tabs">
      <a class="tab" href="./">Desk</a>
      <a class="tab" href="shadow">Shadow</a>
      <a class="tab active" href="reports">Reports</a>
    </nav>
  </div>
  <div class="body">
    <div class="sub">The lab reports — the shadow desk, interrogated. Tap one to open in full.</div>
    <div id="list"><div class="empty">Loading…</div></div>
    <div class="foot">Reports are authored on the desk · nothing here arms anything · prescribe, you decide.</div>
  </div>
</div>
<script>
(async function(){
  const el = document.getElementById('list');
  try{
    const r = await fetch('api/reports'); const d = await r.json();
    const reps = d.reports || [];
    if(!reps.length){ el.innerHTML = '<div class="empty">No reports yet.</div>'; return; }
    el.innerHTML = reps.map(function(x){
      var pdf = x.pdf ? '<a class="pdf" href="static/'+x.pdf+'" download>Download PDF</a>' : '';
      return '<div class="rcard">'
        + '<a class="rhit" href="static/'+x.file+'">'
        +   '<div class="rk"><span class="kind">Weekly</span><span class="rdate">'+x.date+'</span></div>'
        +   '<div class="rtitle">'+ (x.title||x.file) +'</div></a>'
        + '<div class="ractions"><a class="open" href="static/'+x.file+'">Open report</a>'+pdf+'</div>'
        + '</div>';
    }).join('');
  }catch(e){ el.innerHTML = '<div class="empty">Could not load reports.<br>'+e+'</div>'; }
})();
</script>
</body></html>
