<!DOCTYPE html>
<!--
  GAZBOT V7 — MNQ DESK (2026-07-13)
  Single-instrument (MNQ) view of the futures desk. Read-only presentation layer.
  Data: /api/futures/mnq (MNQ-scoped header/gates/trades) + /api/futures/us-terminal
  (holdings/DTT/regime/margin, filtered to MNQ) + /api/futures/bars/<MNQ|MGC> (hero price).
  Aesthetic ref: gazbot_mnq_mockup.html. Spec: docs/GAZBOT_MNQ_BUILD_SPEC.md.
  Desktop = 4-col grid; phone = sticky KPI header + tab bar + single-column stack.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GAZBOT V7 · MNQ DESK</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>

<div class="topstick">
<header>
  <div class="brand">GAZBOT <span class="v">V7</span></div>
  <div class="tag">MNQ DESK · MICRO NASDAQ 100 · <span id="expiry">—</span></div>
  <div class="conn" id="conn"><span class="dot"></span><span id="conn-label">CONNECTING…</span></div>
  <span class="chip" id="mkt-chip">—</span>
  <span class="chip" id="safety-chip">SAFETY —</span>
  <div class="spacer"></div>
  <!-- ★2026-08-13 PHONE HEADER REBUILD. Two elements moved OUT of .kpis so each header row can own
       its own vertical space on a phone (the fault was one nowrap overflow-x scroller holding tiles
       of unequal height — the 3-line TODAY tile hung below its 2-line siblings and collided with the
       bordered NET box). DOM order is chosen so DESKTOP is unchanged: .spacer still pushes NET and
       the KPIs right, so NET renders exactly where it always did, immediately left of the tiles.
       On phone, grid-template-areas puts NET beside the SAFETY chip and gives TRN/RDR its own row. -->
  <div class="kpi box" id="net-tile"><span class="l" title="all figures NET of the round-turn fee">NET</span><span class="v cyan" id="k-fee">—</span></div>
  <div class="kpis">
    <div class="kpi" title="TODAY = BOTH desks (tournament + day rider). The split is on its own line below.">
      <span class="l">TODAY</span><span class="v" id="k-today">—</span></div>
    <div class="kpi"><span class="l">YEST</span><span class="v" id="k-yest">—</span></div>
    <div class="kpi"><span class="l">2D</span><span class="v" id="k-d2">—</span></div>
    <div class="kpi"><span class="l">7D</span><span class="v" id="k-d7">—</span></div>
    <div class="kpi"><span class="l">30D</span><span class="v" id="k-d30">—</span></div>
    <div class="kpi"><span class="l">WIN%</span><span class="v" id="k-win">—</span></div>
    <div class="kpi"><span class="l">PARIS</span><span class="v" id="clock">--:--:--</span></div>
  </div>
  <!-- Row 4: the desk split. Its own line, never sharing a row with the period strip — they are
       unrelated data classes and interleaving them is what made the bar unreadable. -->
  <div class="kpisub" id="k-today-sub" title="TRN = tournament (the gate book you route) · RDR = day rider (own service, own clientId, holds for hours)"><span
      id="k-today-trn">—</span><i>·</i><span id="k-today-rdr">—</span></div>
</header>
<div class="halt-banner" id="halt">DESK HALTED</div>

<!-- phone tab bar (hidden on desktop) -->
<nav class="tabbar" id="tabbar">
  <button class="tab on" data-tab="trade">TRADE<span class="b" id="tb-desk">—</span></button>
  <!-- ★2026-09-18 TOURNEY -> DAYS. The tournament stopped trading and his own book is the desk
       now; this slot is the 14-day history he asked to live in. -->
  <button class="tab" data-tab="days">DAYS<span class="b" id="tb-days">—</span></button>
  <!-- ★ the empty .b is deliberate: every other tab stacks label-over-value, and without a value
       cell CHART's label centred across both rows and sat off-baseline from its neighbours. -->
  <button class="tab" data-tab="trades">TRADES<span class="b" id="tb-trades">—</span></button>
</nav>
</div><!-- /topstick -->

<div class="grid">

  <!-- LEFT RAIL — DESK STATS -->
    <!-- HERO — PRICE CHART (MNQ or MGC) -->
    <!-- TOURNAMENT — the 6-gate scoreboard (the headline) -->

  <!-- HOLDINGS -->
  <!-- ★★★2026-09-18 LAST 14 SESSIONS, clickable. ⚠ "entries" are DECISIONS, not rows: the rows in
       `trades` are scale-out EXITS of one entry, so counting them overstates activity ~2.5x. The
       drill shows the individual exits. -->
  <!-- ★★★2026-09-24 THE TRADE TAB. Operator: "desk, chart and hold can be combined into 1 nice
       clean tab called TRADE... the only features i look and use are chart, time toggles, BUY SELL
       FLATTEN, current holding, the first 2 take profits." Everything else on the old DESK panel
       was deleted on his instruction.
       ⚠ POS AGE is in the strip because it is the ONLY metric here with a measured price attached:
       holds over 3 hours are -$7,023 across 22 entries, his most expensive pattern.
       ⚠ PASS stays, small, because it is build-queue item 1 and the blocker for ever automating his
       reads — six days live and still zero presses. If it does not live where he trades, it dies. -->
  <section class="panel on" id="p-trade" data-tab="trade">
    <!-- ★★2026-09-24 ORDER, top to bottom: HOLDING first. Operator: "i watch that live p&l like a
         hawk... at the moment i need to scroll down all the time." Then the actions, then the
         chart, and everything he only checks occasionally at the bottom. -->
    <div class="holdcard" id="hold-body"><div class="empty">flat</div></div>

    <!-- ⚠ Circular targets are easy to hit by accident, so every one of these confirms. BUY/SELL
         also take the PIN (they place an order); FLATTEN does NOT — it only ever reduces risk, and
         friction on a kill switch costs money. -->
    <div class="actions">
      <button class="orb buy"  id="buy-long"><span>BUY</span><em id="orb-qty">4</em></button>
      <button class="orb sell" id="buy-short"><span>SELL</span><em>4</em></button>
      <button class="orb flat" id="flat-all"><span>FLATTEN</span><em id="orb-pos">flat</em></button>
      <button class="orb away" id="sa-btn"><span id="sa-lab">STEP AWAY</span><em id="sa-state">off</em></button>
    </div>
    <div class="awayset">
      <label>stop −$<input id="sa-loss" type="number" min="50" max="5000" step="50" value="200"></label>
      <label>take +$<input id="sa-tp" type="number" min="50" max="20000" step="50" value="300"></label>
      <!-- ★★★2026-09-24 THE ON-PAGE ALERT. Measured the same day: tape -> detection is <=1.00s
           (MD_STREAM publishes MNQ at exactly 1Hz), python spawn 0.039s, Telegram API round trip
           0.043s — so the desk delivers in under 1.1s and the ~10s the operator sees is entirely
           Telegram -> Apple push -> handset, which we have no lever on. This page is ALREADY
           connected and ALREADY polling at 1Hz, so it can beat that by ~9s in the one case that
           matters: the tab open in front of him.
           ⚠⚠ IT IS AN ADDITION TO TELEGRAM, NOT A REPLACEMENT. It exists only while the tab is
           open and foregrounded — iOS suspends timers in a background tab. Telegram stays the
           alarm channel of record and nothing here may be allowed to imply otherwise. -->
      <button id="al-btn" class="albtn" title="Beep on the same ladder the Telegram alerts use: armed at $200, every $50 after, and $75 off the high. Works only while this tab is open and in front of you.">&#128276; <span id="al-lab">ALERTS off</span></button>
    </div>
    <!-- ⚠⚠ HTML5 <audio>, NOT WebAudio. On iPhone a WebAudio tone is silenced by the hardware
         ringer switch; a media element is not. He is on the phone almost all the time, so the
         channel that survives a muted handset is the only one worth having. -->
    <audio id="al-snd" preload="auto" playsinline src="data:audio/wav;base64,UklGRuQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YcADAACAgYOEgn13dHZ/ipKSiXprZGp8kaChknhgVV13l66xnHlWRU9wm7vAqHtONkBoncbRtX9IKDBdndHhxIZDGh9Rm9jt0I1FFxlLlNTu1JRLGRdFjdDt2JtRHBU/hsvt3KFXHxM5gMbs4KheIxI0ecDq465kJxIvcrro5rRrKxIra7Tm6LpyLxInZK7j6sB5NBIjXqjg7MaAORMfV6Hc7cuGPxUcUZvY7dCNRRcZS5TU7tSUSxkXRY3Q7dibURwVP4bL7dyhVx8TOYDG7OCoXiMSNHnA6uOuZCcSL3K66Oa0aysSK2u05ui6ci8SJ2Su4+rAeTQSI16o4OzGfzkTH1eh3O3Lhj8VHFGb2O3QjUUXGUuU1O7UlEsZF0WN0O3Ym1EcFT+Gy+3coVcfEzl/xuzgqF4jEjR5wOrjrmQnEi9yuujmtGsrEitrtObounIvEidkruPqwHk0EiNeqODsxn85Ex9Xodzty4Y/FRxRm9jt0I1FFxlLlNTu1JRLGRdFjdDt2JtRHBU/hsvt3KFXHxM5gMbs4KheIxI0ecDq465kJxIvcrro5rRrKxIra7Tm6LpyLxInZK7j6sB5NBIjXqjg7MZ/ORMfV6Hc7cuGPxUcUZvY7dCNRRcZS5TU7tSUSxkXRY3Q7dibURwVP4bL7dyhVx8TOYDG7OCoXiMSNHnA6uOuZCcSL3K66Oa0aysSK2u05ui6ci8SJ2Su4+rAeTQSI16o4OzGfzkTH1eh3O3Lhj8VHFGb2O3QjUUXGUuU1O7UlEsZF0WN0O3Ym1EcFT+Gy+3coVcfEzl/xuzgqF4jEjR5wOrjrmQnEi9yuujmtGsrEitrtObounIvEidkruPqwHk0EiNeqODsxoA5Ex9Xodzty4Y/FRxRm9jt0I1FFxlLlNTu1JRLGRdFjdDt2JtRHBU/hsvt3KFXHxM5gMbs4KheIxI0ecDq465kJxIvcrro5bRrLBQta7Pi5LhyNBgsZqvc4rt5Ox0sYaTV371/QiIsXZ3O3L+FSictWZbI2MCLUS0vVpDB1MCPVzIxVIq70MCTXjg0UoS0y8CXZD43UICux7+aakQ6UHuowr2cb0o+UHeivbuedE9CUHSdt7ifeFVGUXGYsrWgfFpKU2+TrbKgf2BPVW6OqK6ggmVUV22Ko6qfhWlYWmyHnqadh21dXWyEmaKbiHFiYG2BlZ6ZiXVmZG6AkZqWiXhrZ29+jZWTiXpva3F9ipGQiHxzb3N9h42Nh352dHZ9hImJhX96eHl9goWFg399fH1+gIGBgIA="></audio>
    <div class="alflash" id="al-flash"></div>

    <div class="hero-body">
      <!-- ★★2026-09-24 #symnote is an OVERLAY inside the chart box, so it costs no vertical
           space (the toggle row below must stay one line). It is the ONLY thing on this page
           that says the chart is gold, or that the contract on screen is not the one the
           button claims. setSymNote() writes "" for the normal MNQ case and :empty hides it.
           ⚠ It was deleted in the TRADE merge and setSymNote has been writing into nothing
           ever since — an MGC chart under MNQ meters with no label is precisely the
           multi-symbol confusion this desk has already paid for. -->
      <div class="chart-host"><svg id="price-svg" preserveAspectRatio="none"></svg><div id="symnote"></div></div>
      <div class="tfbar" id="tfbar">
        <button class="tf" data-min="30">30m</button>
        <button class="tf" data-min="60">1h</button>
        <button class="tf on" data-min="120">2h</button>
        <button class="tf" data-min="240">4h</button>
        <button class="tf" data-min="480">8h</button>
        <button class="tf" data-min="session">DAY</button>
        <span class="tfsp"></span>
        <button class="tf sym on" data-sym="MNQ">MNQ</button>
        <button class="tf sym" data-sym="MGC">MGC</button>
      </div>
    </div>

    <!-- ★★2026-09-24 SIX CELLS, TWO ROWS, GROUPED BY THE QUESTION THEY ANSWER.
         Row 1 is the DAY's character; row 2 is RIGHT NOW. Operator: "i feel like i need 1 and 2.
         shows me if a surge is backed and real." RVOL cannot answer that — it asks "unusual for
         this time of day" and therefore sits at ~1.0 through every open by construction, because
         today's thrusts are being compared with other days' thrusts. PULSE and FLOW ask about now
         versus the minutes before it, which is the actual question.
         ⚠ The second row costs ~25px. The padding below was tightened to pay for it; if anything
         falls off the one-screen budget, this row is the thing to reconsider. -->
    <div class="tstrip">
      <span class="tm"><i>ATR</i><b id="ctx-atr">—</b></span>
      <span class="tm"><i>EFFICIENCY</i><b id="ctx-er">—</b></span>
      <span class="tm"><i>RVOL</i><b id="ctx-rvol">—</b></span>
      <span class="tm" title="This minute's volume vs the MEDIAN of the previous 15 minutes OF THIS SESSION. No cross-day baseline, so the contract roll cannot touch it. Above ~1.5x the surge has volume behind it. DESCRIPTIVE — it does not forecast.'"><i>PULSE</i><b id="ctx-pulse">—</b></span>
      <span class="tm" title="Aggressor imbalance over the last 2 minutes: +1 all buyers lifting, -1 all sellers hitting. 'neutral' trades (13% of tape) are EXCLUDED, never split. DESCRIPTIVE — it says who is crossing the spread right now, not where price goes next."><i>FLOW</i><b id="ctx-flow">—</b></span>
      <span class="tm"><i>POSITION AGE</i><b id="ctx-posage">—</b></span>
    </div>
    <div class="passrow">
      <input id="pass-note" type="text" maxlength="120" placeholder="looked but didn't trade — why not?">
      <button id="pass-btn" title="Records what the tape looks like right now and that you decided AGAINST trading it. Places no order.">PASS</button>
    </div>
  </section>

  <section class="panel" id="p-days" data-tab="days">
    <div class="sec">LAST 14 SESSIONS <span class="dim3" id="days-sum"></span></div>
    <div class="pb" id="days-wrap"><table class="t" id="days-tbl"><tbody></tbody></table></div>
  </section>

    <!-- RIGHT RAIL — TODAY · TRADES -->
  <section class="panel" id="p-trades" data-tab="trades">
    <div class="ph"><h2>TODAY · TRADES</h2><span class="sub" id="trades-meta">—</span></div>
    <div class="pb">
      <div class="sec" style="margin-top:0">REALISED CURVE <span class="dim3" id="curve-end">—</span></div>
      <div class="curve-host"><svg id="curve-svg" viewBox="0 0 1000 120" preserveAspectRatio="none"></svg></div>
      <table><thead><tr><th>TIME</th><th>SIDE</th><th>GATE</th><th>EXIT</th><th>$</th><th>%</th></tr></thead>
        <tbody id="blotter"><tr><td class="empty" colspan="6">—</td></tr></tbody></table>
    </div>
  </section>

  <!-- EXECUTION HEALTH — signal → fill through-rate + slippage + blocks -->

</div>

<!-- drill-down modal -->
<div id="drill-back" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40" onclick="if(event.target===this)MNQ.closeDrill()">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:86vh;background:var(--panel);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;overflow:hidden">
    <div class="ph"><h2 id="drill-title">—</h2><span class="sub" style="cursor:pointer" onclick="MNQ.closeDrill()">✕ close</span></div>
    <div id="drill-agg" class="pb" style="flex:none;border-bottom:1px solid var(--line);padding-bottom:8px"></div>
    <div class="pb" style="padding-top:6px">
      <table><thead><tr><th>TIME</th><th>SIDE</th><th>EXIT</th><th>ENTRY</th><th>EXIT</th><th>$</th><th>%</th></tr></thead>
        <tbody id="drill-rows"></tbody></table>
    </div>
  </div>
</div>

<script src="static/app.js"></script>
</body>
</html>
