# 2026-08-08: the 08-07 report run grew to 6.5GB on a 7.5GB box and was OOM-killed at
# 04:46 UTC, taking the whole machine into memory pressure (journald cache-flushing,
# tournament "completed orders request timed out"). Two further manual continuations
# died the same way at 07:39 and 11:19.
# MemoryHigh throttles + reclaims first; MemoryMax is the hard local ceiling so the
# cgroup OOMs ITSELF rather than triggering a global OOM that picks a victim at random.
#
# ★★2026-08-13 RAISED 3G/4G/1G -> 4.5G/5.5G/2G. Operator: "its saturday morning, theres
# absolutely nothing happening on the desk" and "we are not running NASA".
# He is right, and the old ceiling was never survivable: 4G+1G = 5,120MB effective against
# an observed peak of 7,310MB. It was 2.2GB short — the cap protected the BOX and
# guaranteed the REPORT died. Tidier, not fixed.
# Measured on the box: total 7,745MB, desk services ~931MB, IB gateway ~969MB, and a 2GB
# swapfile sitting 88% UNUSED. 5.5G + 2G = 7,680MB clears the worst observed peak by
# ~370MB, and MemoryHigh at 4.5G throttles into that swap BEFORE the hard cap, so the job
# slows instead of dying — the right trade for a batch job with an 8h window.
# Free this weekend because the CME is shut 21:00 Fri -> 22:00 Sun and the whole report
# window (22:07 Fri + 8h = 06:07 Sat) sits inside it.
#
# ⚠ REVERT TO 3G/4G/1G IF THIS EVER RUNS WITH THE MARKET OPEN. At these limits the report
# plus the desk exceeds physical RAM and the desk would swap. Harmless on a dead tape, not
# harmless on a live one — OOMScoreAdjust=-500 protects the trading path from the killer,
# not from being slow.
[Service]
MemoryHigh=4608M
MemoryMax=5632M
MemorySwapMax=2048M
