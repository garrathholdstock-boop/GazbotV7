# ★★2026-08-14 THE REPORT IS THE LAST THING THE KERNEL SHOULD KILL ON A FRIDAY NIGHT.
#
# Three headless-Claude jobs fire INSIDE the report window (22:07Z->05:15Z):
#   22:43 gazbot7-claude-job@nightly-review   (Mon..Fri 22:43)
#   00:13 gazbot7-claude-job@ledger-review    (every day 00,04,08,12,16,20:13)
#   04:13 gazbot7-claude-job@ledger-review
# plus gazbot7-backup at 03:30. The box is 7.5GB and has taken three global_oom
# kills (08-08). Under global memory pressure the kernel picks the LARGEST victim —
# which is the report, the one job that cannot be re-run before the operator wakes.
#
# This does NOT reserve memory and does not disable those jobs; they do real work
# and are cheap. It only changes WHO DIES if the box runs out: a nightly-review can
# be re-run in the morning, a Friday report cannot.
#
# Note this is orthogonal to MemoryMax/MemoryHigh (5.5G/4.5G + 2G swap), which cap
# the report's OWN cgroup. Those handle the report growing; this handles everything
# else growing around it.
[Service]
OOMScoreAdjust=-700
