# ★★2026-08-08 — THE TUNNEL FIX. cloudflared runs token-managed, so its ingress lives in the
# Cloudflare dashboard and cannot be edited from this box. Its rule points at http://localhost:8080,
# which was RETIRED V5's port — nothing has listened there since 2026-07-16, so dashboard.gazbot.dev
# returned 502 for everything, including the Friday report.
# Rather than chase the remote config, we make 8080 answer correctly: this block terminates the
# tunnel and serves V7 exactly as the :80/:443 blocks do.
# ⚠ DELIBERATELY NO `location / { proxy_pass 127.0.0.1:8080 }` HERE — those blocks forward / to 8080,
# and repeating that inside the server that LISTENS on 8080 is an infinite proxy loop. Bare / and
# /v7shadow are redirects, never proxies back to self.
server {
    listen 127.0.0.1:8080;
    server_name _;
    # Relative redirects only. With the default absolute_redirect, nginx builds the Location header
    # from ITS OWN listening port, so `/` handed the browser http://dashboard.gazbot.dev:8080/v7/ —
    # leaking the internal port and dropping the visitor from HTTPS to plain HTTP. Relative Locations
    # resolve against whatever the client actually asked for, which is the tunnel's https origin.
    absolute_redirect off;
    location = / { return 301 /v7/; }
    location = /v7 { return 301 /v7/; }
    location = /v7shadow { return 301 /v7/shadow; }
    location /v7/ {
        proxy_pass http://127.0.0.1:8087/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
server {
    listen 80;
    server_name _;
    location = /v7 { return 301 /v7/; }
    location = /v7shadow { return 301 /v7/shadow; }
    location /v7/ { proxy_pass http://127.0.0.1:8087/; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
server {
    listen 443 ssl;
    server_name _;
    location = /v7 { return 301 /v7/; }
    location = /v7shadow { return 301 /v7/shadow; }
    location /v7/ { proxy_pass http://127.0.0.1:8087/; }
    ssl_certificate /etc/nginx/alphabot.crt;
    ssl_certificate_key /etc/nginx/alphabot.key;
    location /agent/ {
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
    location /agent {
        return 301 /agent/;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
